# Releases are immutable once published, so the zip Marketplace installs from (hacs.json zip_release) has to be attached
# while the release is still a draft. Write the release as a draft in GitHub as usual, with its notes and whether
# it's a pre-release, then run this from the Actions tab with its tag, to attach the zip and publish it.

name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release, such as v0.8.0"
        required: true
        type: string

# Nothing by default; the job grants what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      # write, as only a token that can push sees draft releases - nothing is written here
      contents: write
    outputs:
      ref: ${{ steps.draft.outputs.ref }}
    steps:
    - name: Find the draft release
      id: draft
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
        if [ "$(jq -r .isDraft <<<"$release")" != "true" ]; then
          echo "::error::$TAG is already published, and a published release can't have the zip added. Draft a new release."
          exit 1
        fi
        # a tag chosen as new in the draft isn't made till the release is published, so till then the draft's
        # target is what's released
        if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" >/dev/null; then
          ref="refs/tags/$TAG"
        else
          ref=$(jq -r .targetCommitish <<<"$release")
        fi
        echo "Releasing $TAG from $ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      # to check out the release's source
      contents: read
      # for the build provenance attestation of the zip
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.draft.outputs.ref }}
        persist-credentials: false

    - name: Package release zip
      run: |
        cd custom_components/camera_autonotify
        zip -r "$GITHUB_WORKSPACE/camera_autonotify.zip" . -x "__pycache__/*" "*/__pycache__/*"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: camera_autonotify.zip

    - name: Keep the zip for the release
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-zip
        path: camera_autonotify.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # to attach the zip to the draft and publish it
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-zip

    - name: Attach zip to the draft
      run: gh release upload "$TAG" camera_autonotify.zip --clobber --repo "$GITHUB_REPOSITORY"

    - name: Publish
      run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
