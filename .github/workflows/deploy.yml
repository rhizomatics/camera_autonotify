# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Github Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # releases are published, with their zip, by release.yml

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Marketplace Action
      uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
      with:
        category: "integration"
    - name: Marketplace Hassfest
      uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install dependencies
      run: uv sync
    - name: Ruff lint
      run: uv run ruff check custom_components tests
    - name: Ruff format
      run: uv run ruff format --check custom_components tests
    - name: Test with pytest
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        uv run pytest . --junitxml="junit/test-results-$PYTHON_VERSION.xml" --cov=custom_components.camera_autonotify --cov-report=xml --cov-report=html
    - name: Keep the test results for the badges
      # the tests of a pull request aren't those of main
      if: github.event_name == 'push'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: badge-inputs
        path: |
          coverage.xml
          junit/test-results-${{ matrix.python-version }}.xml
        retention-days: 1

    - name: Upload pytest test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: junit/test-results-${{ matrix.python-version }}.xml
        # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

    - name: ProperDocs
      run:  |
        uv sync --dev --group docs
        uv run properdocs build
    - name: Upload docs site
      # only main is published, a pull request just proves the docs build
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site

  # From main only - never from a pull request. The only job here that can write to the repository, and the token is
  # given to just the step that pushes, never left in a checkout.
  badges:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # to push the badges branch
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: badge-inputs
    - name: Generate badges
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        uv run genbadge coverage -i coverage.xml -o badges/coverage.svg
        uv run genbadge tests -i junit/test-results-*.xml -o badges/tests.svg

        TEMP_DIR=$(mktemp -d)
        cd "$TEMP_DIR"
        REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        # the first time there's no badges branch to add to, so one is started with nothing else on it
        if ! git clone --single-branch --branch badges "$REMOTE_URL" . 2>/dev/null; then
          git init --initial-branch badges .
          git remote add origin "$REMOTE_URL"
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        cp -r "$GITHUB_WORKSPACE/badges" .
        git add badges
        if git commit -m "Update badges [skip ci]"; then
          git push origin badges --force
          echo "Badges updated successfully"
        else
          echo "No changes to badges"
        fi
        rm -rf "$TEMP_DIR"

  deploy-docs:
    # Pages is set to deploy from GitHub Actions, so the site goes up as an artifact rather than a gh-pages branch
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # to deploy the site to Pages
      pages: write
      # for the Pages deployment's OIDC token
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
