# Quality Scale tracking for Camera AutoNotify
# Created: 2026-11-06 (2026-Q4 architecture review, rhizomatics/hq-private)
# Rule set verified against https://contributors.home-assistant.io/core/quality-scale/rules/#checklist
# (HA 2026.11; 54 rules: Bronze 20, Silver 10, Gold 21, Platinum 3). No rules added, removed,
# renamed or moved since the set Supernotify verified on 2026-08-06.
#
# The integration follows Frigate reviews over MQTT, and anpr2mqtt and image processing sources, and notifies
# through Supernotify or notify entities, with one device per entry (device.py). Its only entity is a camera's
# optional Last notification snapshot camera (camera.py).
#
# Changelog
# 2026-11-06: first file. Silver met once docs-removal-instructions is done (same change).
# 2026-11-13: exception-translations done.
# 2026-11-27: Platinum. The camera entity, actions, DVLA lookups and anpr2mqtt sources added since are now
#   assessed; strict typing, action errors, a repair for an entry whose source has gone, troubleshooting docs
#   and icons added.

rules:
  # ==================
  # BRONZE TIER
  # ==================

  action-setup:
    status: done
    comment: |
      services.py, registered in async_setup: classify_plate, add_plate, remove_plate, list_vehicle_categories and reset_sightings.

  appropriate-polling:
    status: done
    comment: |
      The camera entity isn't polled (should_poll False). Frigate's health check interval is a setting (health.py).

  brands:
    status: done
    comment: Icons and logos in custom_components/camera_autonotify/brand/, checked by the Marketplace action in CI.

  common-modules:
    status: done
    comment: |
      hub.py (one MQTT subscription per Frigate topic prefix, shared by the entries), tracker.py
      (the review state machine, no Home Assistant dependency), notifier.py, frigate.py, device.py,
      discovery.py and supernotify_api.py. No coordinator, since there is nothing to poll.

  config-flow:
    status: done
    comment: |
      config_flow.py: user, import, integration_discovery and confirm steps, and an
      OptionsFlowWithReload. Every top-level field has a data_description in translations/en.json.

  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py and tests/test_settings.py. CI enforces 90% overall coverage (pyproject.toml addopts).

  dependency-transparency:
    status: done
    comment: No requirements in manifest.json.

  docs-actions:
    status: done
    comment: docs/vehicles.md, How it Works, Actions.

  docs-conditions:
    status: exempt
    comment: Provides no conditions.

  docs-high-level-description:
    status: done
    comment: README.md introduction.

  docs-installation-instructions:
    status: done
    comment: README.md "What You Need" and "Install".

  docs-removal-instructions:
    status: done
    comment: README.md "Removing" (added 2026-11-06).

  docs-triggers:
    status: exempt
    comment: Provides no triggers.

  entity-event-setup:
    status: done
    comment: |
      camera.py subscribes to the Frigate coordinator in async_added_to_hass, released with async_on_remove.

  entity-unique-id:
    status: done
    comment: |
      camera.py: {entry_id}_last_snapshot.

  has-entity-name:
    status: done
    comment: |
      camera.py, on the entry's device, from HA 2026.8 where devices are linked; named in full before that, with no device.

  runtime-data:
    status: done
    comment: __init__.py sets entry.runtime_data to the ReviewWatcher, typed as CameraAutoNotifyConfigEntry.

  test-before-configure:
    status: exempt
    comment: |
      Nothing to connect to. Entries are only created for Frigate cameras and zones that discovery
      has found in the device and entity registries.

  test-before-setup:
    status: done
    comment: |
      __init__.py raises ConfigEntryNotReady while the Frigate entry's config isn't loaded or MQTT
      isn't connected, so setup retries.

  unique-config-entry:
    status: done
    comment: |
      Unique ID per Frigate camera or zone device, and a single "discovery" entry
      (config_flow.py, async_set_unique_id plus _abort_if_unique_id_configured).

  # ==================
  # SILVER TIER
  # ==================

  action-exceptions:
    status: done
    comment: |
      services.py raises a translated ServiceValidationError where a plate can't be added or removed without Global Settings.

  config-entry-unloading:
    status: done
    comment: |
      async_unload_entry; the shared MQTT subscription is released by the stop callback from
      hub.async_watch, registered with entry.async_on_unload, which also cancels the watcher's
      timers. Notifications run as entry background tasks, cancelled on unload.

  docs-configuration-parameters:
    status: done
    comment: README.md "Settings".

  docs-installation-parameters:
    status: done
    comment: README.md "Install" (the two discovery options), "Choosing Cameras Yourself" and "Zones".

  entity-unavailable:
    status: done
    comment: camera.py is available as the Frigate integration's coordinator finds the server.

  integration-owner:
    status: done
    comment: codeowners in manifest.json.

  log-when-unavailable:
    status: exempt
    comment: |
      Connects to nothing of its own. The Frigate integration logs its server's loss, and health.py notifies it.

  parallel-updates:
    status: done
    comment: camera.py sets PARALLEL_UPDATES = 0, nothing being polled.

  reauthentication-flow:
    status: exempt
    comment: No authentication.

  test-coverage:
    status: done
    comment: --cov-fail-under=90 in pyproject.toml, enforced in CI on the oldest and latest supported HA.

  # ==================
  # GOLD TIER
  # ==================

  devices:
    status: done
    comment: |
      device.py: one device per camera or zone, linked to Frigate's device for it by shared
      identifiers. Only from HA 2026.8, where devices are linked (compat.LINKED_DEVICES); earlier
      releases go without.

  diagnostics:
    status: done
    comment: diagnostics.py, with the entry's data, its options with targets redacted, and the reviews being followed.

  discovery:
    status: done
    comment: |
      discovery.py finds Frigate cameras and zones, anpr2mqtt's sensors and event entities, and image processing entities, set up by themselves (import) or offered as integration_discovery flows.

  discovery-update-info:
    status: exempt
    comment: Discovers Home Assistant devices, not network devices with addresses to update.

  docs-data-update:
    status: done
    comment: README.md "What Gets Sent" (pushed by Frigate over MQTT, nothing polled; added 2026-11-06).

  docs-examples:
    status: exempt
    comment: |
      Needs no automations; notifications are sent with no YAML. docs/migrating.md maps each
      blueprint input to where it is now.

  docs-known-limitations:
    status: done
    comment: README.md "Known Limits".

  docs-supported-devices:
    status: done
    comment: README.md introduction and "What You Need" (Frigate cameras and zones).

  docs-supported-functions:
    status: done
    comment: README.md "Settings" and "What Gets Sent".

  docs-troubleshooting:
    status: done
    comment: README.md Troubleshooting.

  docs-use-cases:
    status: done
    comment: README.md introduction.

  dynamic-devices:
    status: done
    comment: discovery.py listens for Frigate entity registry creations and picks up cameras and zones added after setup.

  entity-category:
    status: done
    comment: The Last notification snapshot camera is the entry's main entity, so has no category.

  entity-device-class:
    status: exempt
    comment: Cameras have no device classes.

  entity-disabled-by-default:
    status: exempt
    comment: The camera entity is only made when chosen in the camera's settings.

  entity-translations:
    status: done
    comment: camera.py's translation_key last_snapshot, in translations/*.json entity.camera.

  exception-translations:
    status: done
    comment: |
      __init__.py raises ConfigEntryNotReady with translation_domain and translation_key, the messages in
      translations/en.json "exceptions" (added 2026-11-13). The wording of each notification and the setup
      screens' notes are in its "common" section, read in Home Assistant's language through texts.py.

  icon-translations:
    status: done
    comment: icons.json, for the camera entity and each action.

  reconfiguration-flow:
    status: exempt
    comment: |
      The entry's data is only the camera's or zone's identity in Frigate; everything that can
      change is in the options flow.

  repair-issues:
    status: done
    comment: |
      __init__.py raises source_gone, with ConfigEntryError, for an entry whose Frigate entry or anpr2mqtt entity has been removed, until the entry is removed. vehicles.py raises lookup_refused for a refused DVLA key.

  stale-devices:
    status: done
    comment: |
      An entry whose source has gone is a repair, its device going with the entry when it's removed (__init__.py).

  # ==================
  # PLATINUM TIER
  # ==================

  async-dependency:
    status: exempt
    comment: No requirements.

  inject-websession:
    status: done
    comment: frigate.py and vehicles.py use async_get_clientsession.

  strict-typing:
    status: done
    comment: mypy strict = true in pyproject.toml for the integration, run in CI by pre-commit.
