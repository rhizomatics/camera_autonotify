site_name: Camera AutoNotify for Home Assistant
site_url: https://camera-autonotify.rhizomatics.org.uk
site_description: Automatic camera notifications through Supernotify, starting with Frigate, with no blueprint or YAML

repo_name: rhizomatics/camera_autonotify
repo_url: https://github.com/rhizomatics/camera_autonotify
edit_uri: edit/main/docs/

theme:
  name: materialx
  custom_dir: docs/overrides
  highlightjs: true
  language: en
  logo: assets/images/icon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search
    - search.share
    - toc.follow
    - toc.integrate

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - autorefs
  - pagetree
  # no optimize plugin: PNGs are compressed as they're committed, by the optimize-png hook, so the build needs no pngquant
  - meta-descriptions
  - tags
  - htmlproofer:
      skip_downloads: True
  - mkdocs-homepage-copier:
      extras:
        - src: CHANGELOG.md
          dest: docs/changelog.md
          copy: true
  - llmstxt:
      base_url: https://camera-autonotify.rhizomatics.org.uk/
      preprocess: docgen/llms_preprocess.py
      markdown_description: >-
        Camera AutoNotify is a Home Assistant custom integration (installed via HACS) that
        sends notifications for what security cameras see through Supernotify, with no
        blueprint, automations or YAML. It starts with Frigate review events, and cameras are
        discovered and added automatically, each with the same filters as the Frigate
        notifications blueprint.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: What it does, requirements, installation, settings, what gets sent, known limits and issues
          - genai.md: Notifications from Frigate's GenAI review summaries and object descriptions, summaries of the day or of anything suspicious, and rules on any notification's message
          - health.md: Notifications when a Frigate server stops responding or a camera stops sending video, retries, and cameras switched off on purpose
        Optional:
          - changelog.md: Release history
        # developer pages left out - coverage reports are no use to an agent
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
  - coverage:
      page_path: developer/coverage
      html_report_dir: htmlcov
  - mkdocstrings:
      handlers:
      # See: https://mkdocstrings.github.io/python/usage/
        python:
          options:
            show_source: false
            show_root_heading: true
            summary: true
            show_inheritance_diagram: false
            overloads_only: true
            show_if_no_docstring: false

extra_javascript:
  - javascripts/markdown_actions.js

hooks:
  # records the site directory for the llmstxt preprocess
  - docgen/llms_preprocess.py


markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - sane_lists
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
